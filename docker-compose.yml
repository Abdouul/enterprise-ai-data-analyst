services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      QDRANT_URL: http://qdrant:6333
      FINANCE_DB_PATH: /app/data/finance.db
      AGENT_MODEL: ${AGENT_MODEL:-gemini-2.5-flash}
      FILTER_EXTRACTION_MODEL: ${FILTER_EXTRACTION_MODEL:-gemini-2.5-flash-lite}
    # Secrets injected at runtime, never baked into the image.
    env_file:
      - ./src/.env
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
